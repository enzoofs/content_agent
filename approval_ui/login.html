<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Central de Conteúdo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Página deliberadamente sem tema de brand (ainda não sabemos quem é
       o usuário) — usa os tokens default de style.css, sem overrides. */
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      width: 100%;
      max-width: 360px;
      padding: var(--space-8);
      background: var(--surface-1);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .login-box h1 {
      font-family: "Playfair Display", serif;
      font-size: var(--text-2xl);
      color: var(--ink-1);
      margin: 0 0 var(--space-6);
      text-align: center;
    }
    .login-box label {
      display: block;
      font-size: var(--text-sm);
      color: var(--ink-2);
      margin-bottom: var(--space-4);
    }
    .login-box input {
      display: block;
      width: 100%;
      margin-top: var(--space-1);
    }
    .login-box .btn {
      width: 100%;
      margin-top: var(--space-2);
    }
    .login-erro {
      color: var(--red);
      font-size: var(--text-sm);
      margin: 0 0 var(--space-4);
      display: none;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-box">
    <h1>Central de Conteúdo</h1>
    <p class="login-erro" id="login-erro">Email ou senha inválidos.</p>
    <form id="login-form">
      <label>Email
        <input type="email" name="email" required autofocus>
      </label>
      <label>Senha
        <input type="password" name="senha" required>
      </label>
      <button type="submit" class="btn btn-approve">Entrar</button>
    </form>
  </div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const erro = document.getElementById("login-erro");
      erro.style.display = "none";
      const body = {
        email: form.email.value,
        senha: form.senha.value,
      };
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        location.href = "/";
      } else {
        erro.style.display = "block";
      }
    });
  </script>
</body>
</html>
