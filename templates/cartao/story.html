<!DOCTYPE html>
<!-- cartao/story.html — Instagram Story 1080×1920, layout "Cartão central".
     Cartão respeita a safe-area inferior do Instagram (~280px) subindo
     dela, e o logo fica dentro da safe-area superior (~220px). -->
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: '$font_heading_family';
    font-style: normal;
    font-weight: $font_heading_weight;
    src: url('$font_heading_file') format('woff2');
  }
  @font-face {
    font-family: '$font_body_family';
    font-style: normal;
    font-weight: 400;
    src: url('$font_body_400_file') format('woff2');
  }
  @font-face {
    font-family: '$font_body_family';
    font-style: normal;
    font-weight: 600;
    src: url('$font_body_600_file') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: ${width}px;
    height: ${height}px;
    overflow: hidden;
    position: relative;
    font-family: '$font_body_family', sans-serif;
  }

  .bg {
    position: absolute;
    inset: 0;
    background-image: url('$background_image');
    background-size: cover;
    background-position: center;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(26, 32, 56, 0.4) 0%,
      rgba(26, 32, 56, 0) 34%
    );
  }

  .logo-badge {
    position: absolute;
    top: 70px;
    left: 60px;
    height: 72px;
    width: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }

  .card {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 320px;
    background: $navy;
    padding: 56px 64px 64px;
    display: flex;
    flex-direction: column;
  }

  .gold-rule {
    width: 64px;
    height: 4px;
    background: $gold;
    margin-bottom: 30px;
  }

  .headline {
    font-family: '$font_heading_family', serif;
    font-weight: $font_heading_weight;
    font-size: ${headline_size}px;
    line-height: 1.1;
    color: #FFFFFF;
    margin-bottom: 22px;
    letter-spacing: -0.8px;
  }

  .subheadline {
    font-family: '$font_body_family', sans-serif;
    font-weight: 600;
    font-size: 20px;
    color: $gold;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 2.2px;
  }

  .body-text {
    font-family: '$font_body_family', sans-serif;
    font-weight: 400;
    font-size: 23px;
    line-height: 1.55;
    color: rgba(255,255,255,0.85);
    margin-bottom: 36px;
    max-width: 92%;
  }

  .cta {
    display: inline-block;
    padding: 16px 32px;
    background: $gold;
    color: $navy;
    font-family: '$font_body_family', sans-serif;
    font-weight: 600;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    width: fit-content;
    border-radius: 3px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  $overlay_html
  <img class="logo-badge" src="$logo" alt="Mendes & Vaz">
  <div class="card">
    <div class="gold-rule"></div>
    <h1 class="headline">$headline</h1>
    $subheadline_html
    <p class="body-text">$body_text</p>
    <div class="cta">$cta_text</div>
  </div>
</body>
</html>
