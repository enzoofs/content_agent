# fly.toml — deploy content_agent (cliente Mendes & Vaz) no Fly.io
# Região GRU (São Paulo) pra latência baixa com o Henrique.
# Auto-stop ligado: máquina dorme sem tráfego (~US$1-3/mês esperado).

app = "content-agent-vrz77a"
primary_region = "gru"

[build]

[env]
  APPROVAL_HOST = "0.0.0.0"
  APPROVAL_PORT = "8080"
  USE_MOCK_IMAGES = "false"
  BRAND = "mendes_vaz"

# Volume persistente — SQLite + PNGs sobrevivem a restart/deploy
[[mounts]]
  source = "content_agent_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Healthcheck simples — Flask responde 200 em / (SPA)
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
